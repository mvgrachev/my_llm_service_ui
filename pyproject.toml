[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-service"
version = "1.0.0"
description = "API service for LLM operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "openai>=1.45.0",
    "langchain>=0.0.1",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
streamlit = [
    "streamlit",
]

[project.scripts]
llm-service = "main:main"

[tool.setuptools.packages.find]
include = ["api*", "config*", "llm*", "services*", "cache*"]
exclude = ["tests*", "*.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
