name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,.git,.github

  test:
    name: Tests (test_chat.py)
    runs-on: ubuntu-latest
    env:
      YANDEX_CLOUD_FOLDER: test-folder-id
      YANDEX_CLOUD_API_KEY: test-api-key
      YANDEX_CLOUD_MODEL: deepseek-v4-flash/latest
      YANDEX_CLOUD_BASE_URL: https://ai.api.cloud.yandex.net/v1
      APP_ENV: test
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (test_chat.py)
        run: |
          pytest tests/test_chat.py -v --tb=short

  streamlit:
    name: Streamlit smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YANDEX_CLOUD_FOLDER: "test-folder-id"
      YANDEX_CLOUD_API_KEY: "test-api-key"
      YANDEX_CLOUD_MODEL: "deepseek-v4-flash/latest"
      APP_ENV: "test"
      DEEPSEEK_TIMEOUT: "30"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit httpx

      - name: Start FastAPI server with mocked LLM
        run: |
          python start_server.py &
          SERVER_PID=$!
          echo "FastAPI PID: $SERVER_PID"
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "FastAPI is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "FastAPI failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Start Streamlit in CI headless mode
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 --server.baseUrlPath=/ &
          STREAMLIT_PID=$!
          echo "Streamlit PID: $STREAMLIT_PID"
          echo "STREAMLIT_PID=$STREAMLIT_PID" >> $GITHUB_ENV

          for i in $(seq 1 30); do
            if curl -s http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              echo "Streamlit is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Streamlit failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Verify Streamlit UI is accessible
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/)
          echo "Streamlit main page HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Streamlit main page returned $HTTP_CODE instead of 200"
            exit 1
          fi

          HEALTH=$(curl -s http://localhost:8501/_stcore/health)
          echo "Streamlit health: $HEALTH"

          API_RESPONSE=$(curl -s http://localhost:8000/health)
          echo "FastAPI health: $API_RESPONSE"

      - name: Stop Streamlit and FastAPI servers
        if: always()
        run: |
          if command -v streamlit &> /dev/null && [ -n "$STREAMLIT_PID" ] && kill -0 "$STREAMLIT_PID" 2>/dev/null; then
            echo "Stopping Streamlit (PID: $STREAMLIT_PID)..."
            streamlit stop --server.port 8501 || true
            kill "$STREAMLIT_PID" 2>/dev/null || true
          fi

          if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Stopping FastAPI (PID: $SERVER_PID)..."
            kill "$SERVER_PID" 2>/dev/null || true
          fi

          sleep 2

          if [ -n "$STREAMLIT_PID" ] && kill -0 "$STREAMLIT_PID" 2>/dev/null; then
            echo "Force killing Streamlit..."
            kill -9 "$STREAMLIT_PID" 2>/dev/null || true
          fi
          if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Force killing FastAPI..."
            kill -9 "$SERVER_PID" 2>/dev/null || true
          fi

          echo "All servers stopped."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-logs
          path: |
            *.log
            streamlit.log

  build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: [lint, test, streamlit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*.whl
          retention-days: 7

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI image
        run: |
          docker build -t llm-service-api:ci .

      - name: Build Streamlit image
        run: |
          docker build -f Dockerfile.streamlit -t llm-service-streamlit:ci .

      - name: Validate FastAPI image can start
        run: |
          # Ensure Redis image is available (GitHub Actions services are not visible from nested docker run)
          docker pull redis:7 --quiet 2>/dev/null || true
          
          # Start Redis container
          docker run -d --name ci-redis -p 6379:6379 redis:7 --loglevel warning

          # Wait for Redis to be ready
          for i in $(seq 1 10); do
            if docker exec ci-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Redis failed to start"
              exit 1
            fi
            sleep 1
          done

          # Start FastAPI container with host network to reach Redis on 127.0.0.1
          docker run --rm -d --name llm-test-api --network host \
            -e APP_ENV=test \
            -e YANDEX_CLOUD_FOLDER=test-folder-id \
            -e YANDEX_CLOUD_API_KEY=test-api-key \
            -e YANDEX_CLOUD_MODEL=deepseek-v4-flash/latest \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            llm-service-api:ci

          # Wait for FastAPI to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "FastAPI image health check passed!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "FastAPI image failed to become healthy within 30s"
              docker logs llm-test-api
              exit 1
            fi
            sleep 1
          done

          docker stop llm-test-api >/dev/null 2>&1 || true

      - name: Validate Streamlit image can start
        run: |
          # Ensure Redis image is available (GitHub Actions services are not visible from nested docker run)
          docker pull redis:7 --quiet 2>/dev/null || true
          
          # Ensure Redis is running
          docker ps -q --filter "name=ci-redis" | grep -q . || \
            docker run -d --name ci-redis -p 6379:6379 redis:7 --loglevel warning

          # Start Streamlit container with host network
          docker run --rm -d --name llm-test-streamlit --network host \
            -e APP_ENV=test \
            -e YANDEX_CLOUD_FOLDER=test-folder-id \
            -e YANDEX_CLOUD_API_KEY=test-api-key \
            -e YANDEX_CLOUD_MODEL=deepseek-v4-flash/latest \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e FASTAPI_URL=http://127.0.0.1:8000 \
            llm-service-streamlit:ci

          # Wait for Streamlit to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8501/_stcore/health > /dev/null 2>&1; then
              echo "Streamlit image health check passed!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Streamlit image failed to become healthy within 30s"
              docker logs llm-test-streamlit
              exit 1
            fi
            sleep 1
          done

          docker stop llm-test-streamlit >/dev/null 2>&1 || true

      - name: Inspect built images
        run: |
          echo "=== FastAPI image ==="
          docker inspect llm-service-api:ci --format='Size: {{.Size}} bytes, Created: {{.Created}}'
          docker history llm-service-api:ci --no-trunc

          echo ""
          echo "=== Streamlit image ==="
          docker inspect llm-service-streamlit:ci --format='Size: {{.Size}} bytes, Created: {{.Created}}'
          docker history llm-service-streamlit:ci --no-trunc

          echo ""
          echo "=== Image sizes ==="
          docker images llm-service-api llm-service-streamlit --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker stop llm-test-api llm-test-streamlit ci-redis >/dev/null 2>&1 || true
          docker rm llm-test-api llm-test-streamlit ci-redis >/dev/null 2>&1 || true
